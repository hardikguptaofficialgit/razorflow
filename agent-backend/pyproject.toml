[project]
name = "razorflow-agent-backend"
version = "0.1.0"
description = "RazorFlow agent backend — browser-use + LLM orchestration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "groq>=0.22.0",
    "python-dotenv>=1.0.0",
    "browser-use>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
